name: Native Windows reference Go

on:
  pull_request:
    paths:
      - '.github/workflows/native-windows-go.yml'
      - 'compat.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-go:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner and locked inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected an amd64 runner' }
          $lock = Get-Content -Raw -LiteralPath compat.lock.json | ConvertFrom-Json
          if ($lock.go.version -ne '1.27.3') { throw 'Unexpected Go version' }
          $entries = @($lock.go.additional_archives | Where-Object { $_.platform -eq 'windows/amd64' })
          if ($entries.Count -ne 1 -or $entries[0].archive_url -ne 'https://go.dev/dl/go1.27.3.windows-amd64.zip' -or $entries[0].archive_sha256 -ne 'f26081f438319757f8a1b46d7d0b2c5ec7583d4038e485e0aa725cfde7885fff') { throw 'Unexpected archive lock' }
          $evidence = Join-Path $env:RUNNER_TEMP 'phego-windows-go-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List | Out-File (Join-Path $evidence 'os.txt')
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture | Format-List | Out-File (Join-Path $evidence 'cpu.txt')
          Get-FileHash -Algorithm SHA256 -LiteralPath compat.lock.json | Format-List | Out-File (Join-Path $evidence 'input-sha256.txt')
      - name: Download and verify the locked archive
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'phego-go.zip'
          & curl.exe --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 300 'https://go.dev/dl/go1.27.3.windows-amd64.zip' -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Go archive download failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne 'f26081f438319757f8a1b46d7d0b2c5ec7583d4038e485e0aa725cfde7885fff') { throw 'Go archive digest mismatch' }
      - name: Build and run the probe twice
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'phego-windows-go-evidence'
          $archive = Join-Path $env:RUNNER_TEMP 'phego-go.zip'
          $root = Join-Path $env:RUNNER_TEMP 'phego-windows-go-probe'
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOTOOLCHAIN = 'local'
          $env:GOPROXY = 'off'
          $env:GOSUMDB = 'off'
          $env:GO111MODULE = 'on'
          $env:GOENV = 'off'
          $env:GOWORK = 'off'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $hashes = @()
          foreach ($number in 1, 2) {
            $run = Join-Path $root "run$number"
            $source = Join-Path $run 'src'
            New-Item -ItemType Directory -Path $source -Force | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $run
            [System.IO.File]::WriteAllText((Join-Path $source 'go.mod'), "module example.com/phego/repro-probe`n`ngo 1.27`n", $utf8)
            [System.IO.File]::WriteAllText((Join-Path $source 'main.go'), "package main`nimport (`n`"fmt`"`n`"runtime`"`n)`nfunc main() { fmt.Printf(`"probe %s %s/%s\n`", runtime.Version(), runtime.GOOS, runtime.GOARCH) }`n", $utf8)
            $env:GOCACHE = Join-Path $run 'cache'
            $env:GOPATH = Join-Path $run 'gopath'
            $go = Join-Path $run 'go/bin/go.exe'
            $version = & $go version
            if ($LASTEXITCODE -ne 0 -or $version -ne 'go version go1.27.3 windows/amd64') { throw "Unexpected Go version: $version" }
            Push-Location $source
            try {
              & $go build -trimpath -buildvcs=false -o (Join-Path $run 'probe.exe') .
              if ($LASTEXITCODE -ne 0) { throw "Go build $number failed" }
            } finally { Pop-Location }
            $probe = Join-Path $run 'probe.exe'
            $output = & $probe
            if ($LASTEXITCODE -ne 0 -or $output -ne 'probe go1.27.3 windows/amd64') { throw "Probe $number failed: $output" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $probe).Hash.ToLowerInvariant()
            $hashes += $hash
            @($version, $output, "sha256 $hash") | Set-Content -LiteralPath (Join-Path $evidence "probe-$number.txt")
          }
          if ($hashes[0] -ne $hashes[1]) { throw 'Independent probe binaries differ' }
          'Independent probe binaries match' | Set-Content -LiteralPath (Join-Path $evidence 'result.txt')
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-go-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phego-windows-go-evidence/
          if-no-files-found: warn
          retention-days: 30
